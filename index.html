<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#e5f8ff">
<title>そろばんのおやくそく大冒険！</title>
<style>
:root{
  --ink:#20345c;--muted:#52658a;--sky:#daf4ff;--ground:#bcebcf;--navy:#233b68;
  --mint:#cdf5e4;--pink:#ffdbeb;--lemon:#fff0b8;--lilac:#e9e0ff;--blue:#d9ecff;
  font-family:"Hiragino Maru Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif;
  color:var(--ink);font-weight:700;background:#e9f8ff
}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh}
body[data-level="2"]{--sky:#e8e0ff;--ground:#c6e9e6}
body[data-level="3"]{--sky:#ffe4ed;--ground:#fce9ac}
body[data-level="4"]{--sky:#daf7f1;--ground:#c2edac}
body[data-level="5"]{--sky:#ffeacc;--ground:#e3def8}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid #3854c2;outline-offset:4px}
button:disabled{cursor:default}
h1,h2,h3,p{margin:0}
img{display:block;max-width:100%}
.world{position:fixed;inset:0;z-index:-1;overflow:hidden;background:linear-gradient(var(--sky),#fffaf0 84%)}
.scenery{position:absolute;bottom:0;width:100%;height:46%;min-height:220px}
.cloud{position:absolute;border-radius:100px;background:#ffffffca;width:130px;height:27px;animation:drift 14s ease-in-out infinite alternate}
.cloud::before,.cloud::after{content:"";position:absolute;bottom:0;border-radius:50%;background:inherit;width:60px;height:55px;left:19px}
.cloud::after{width:45px;height:43px;left:65px}.cloud.a{top:16%;left:4%}.cloud.b{top:12%;right:5%;animation-delay:-8s;scale:.83}.cloud.c{top:35%;right:12%;scale:.66}
@keyframes drift{to{translate:33px 0}}
@keyframes float{50%{translate:0 -7px}}
.topbar{max-width:1080px;margin:auto;padding:14px clamp(12px,4vw,42px);display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:9px;color:var(--navy);font-size:.84rem;letter-spacing:.08em}
.brand i{display:grid;place-items:center;width:31px;height:30px;rotate:-8deg;border-radius:8px;background:#ffdb76;font-style:normal;box-shadow:0 3px 0 #f0b25a}
.top-actions{display:flex;align-items:center;gap:7px}
.pill,.button{border:0;border-radius:15px;background:#fff;box-shadow:0 4px 0 #25385922;min-height:46px;padding:9px 13px}
.button{min-height:53px;padding:12px 18px;background:var(--mint)}
.button.primary{background:var(--navy);color:white;box-shadow:0 4px 0 #152544}
button:not(:disabled):active{translate:0 3px;box-shadow:none}
main{max-width:1000px;margin:auto;padding:0 clamp(12px,4vw,30px) 35px}
.home-hero{text-align:center;padding:28px 8px 3px;position:relative}
.home-hero::before{content:"";position:absolute;inset:5px 10% 0;z-index:-1;border-radius:50%;background:radial-gradient(ellipse,#fffdf8 10%,#ffffff60 55%,transparent 74%)}
.title{font-size:clamp(2.05rem,6.5vw,4.65rem);letter-spacing:-.045em;font-weight:1000;line-height:1.04;text-shadow:0 4px #fff,2px 0 #fff,-2px 0 #fff}
.title strong{font-size:1.21em;color:#263e6e;text-shadow:0 5px #fff,3px 0 #fff,-3px 0 #fff,0 8px #b4dff8}
.subtitle{font-size:clamp(.82rem,2.65vw,1.22rem);margin:17px 0 2px}
.cast{display:flex;justify-content:center;align-items:end;gap:clamp(8px,3.4vw,36px);margin:10px auto 0;position:relative;isolation:isolate}
.cast::before{content:"";position:absolute;z-index:-1;bottom:2px;width:76%;max-width:465px;height:24%;border-radius:50%;background:#66ad8742}
.cast .mascot{width:clamp(78px,17vw,151px);height:clamp(100px,18vw,169px);animation:float 4s ease-in-out infinite}
.cast .mascot:nth-child(2){width:clamp(95px,20vw,179px);height:clamp(119px,21vw,194px);animation-delay:-1.4s}
.cast .mascot:nth-child(3){animation-delay:-2.8s}
.mascot{object-fit:contain;object-position:50% 100%;filter:drop-shadow(0 5px 3px #233b6822)}
.menu{max-width:780px;margin:12px auto 0;display:grid;grid-template-columns:repeat(3,1fr);gap:13px}
.card{border:1px solid #fff;border-radius:20px;background:var(--card,#fff);box-shadow:0 5px 0 #25385925,0 10px 20px #25385912;min-height:78px;padding:9px;display:flex;justify-content:center;align-items:center;gap:8px;font-size:clamp(.86rem,2.6vw,1.1rem)}
.card .icon{flex:none;font-size:1.4em}
.card:hover,.choice:hover{filter:brightness(1.035)}
.t1{--card:var(--mint)}.t2{--card:var(--lemon)}.t3{--card:var(--pink)}.t4{--card:var(--blue)}.t5{--card:var(--lilac)}
.panel{max-width:780px;margin:13px auto 0;background:#fffdf8f7;border:1px solid white;border-radius:26px;box-shadow:0 9px 28px #3456881f;padding:clamp(14px,4vw,30px)}
.panel h2{text-align:center;font-size:clamp(1.4rem,4vw,2.1rem)}
.center{text-align:center}
.lead{margin:10px 0 16px;color:var(--muted)}
.guide{display:flex;align-items:center;gap:12px;justify-content:center;margin:12px 0}
.guide .mascot{width:60px;height:66px}
.guide p{max-width:390px}
.levels,.actions{display:flex;flex-wrap:wrap;gap:11px;justify-content:center;margin-top:15px}
.stage{justify-content:flex-start;text-align:left;width:100%;padding:10px 15px;min-height:58px}
.stage strong{margin-right:8px}.stage:disabled{opacity:.63;box-shadow:none}
.game{max-width:830px;margin:auto}
.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:9px;text-align:center}
.hud div{background:#ffffffed;border-radius:13px;padding:6px 2px;font-size:.74rem;line-height:1.1}
.hud b{display:block;font-size:1.17rem;margin-top:5px}
.progress{height:7px;background:#fff9;border-radius:10px;margin-bottom:10px;overflow:hidden}
.progress i{display:block;height:100%;border-radius:10px;background:#427ee0;transition:width .25s}
.quiz{margin:0 auto;max-width:none;padding:clamp(11px,2vw,20px);text-align:center}
.quiz-body{display:grid;grid-template-columns:minmax(190px,1fr) minmax(240px,1fr);align-items:center;gap:0 22px}
.board-label{margin-bottom:6px;font-size:.86rem;color:var(--muted)}
.board{display:block;margin:auto;width:min(100%,215px);height:auto}
.board-img{height:190px;object-fit:contain}
.operand{font-size:clamp(3.5rem,11vw,5.65rem);line-height:.99;letter-spacing:.015em;color:#182e58;font-family:system-ui,sans-serif;font-weight:900}
.prompt{margin:9px auto 11px;font-size:clamp(1rem,3.4vw,1.24rem)}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.choice{min-height:53px;border:2px solid transparent;border-radius:15px;background:var(--card);box-shadow:0 4px 0 #2538592b;padding:5px 2px;font-size:clamp(.93rem,3.4vw,1.08rem)}
.choice[aria-pressed="true"]{border-color:#94395c}
.choice.correct{border-color:#177250;background:#c7f3d9}
.feedback{text-align:left;margin:14px 0 0;display:grid;grid-template-columns:65px 1fr;gap:4px 12px;border-top:1px solid #e3e9f3;padding-top:12px}
.feedback .mascot{width:65px;height:78px;grid-row:span 2}
.feedback.bounce .mascot{animation:cheer .48s ease-out}@keyframes cheer{42%{translate:0 -8px;rotate:-5deg}72%{translate:0 1px;rotate:3deg}}
.feedback h3{color:#086449;font-size:1.28rem}.feedback h3.miss{color:#9b355c}
.feedback p{font-size:.93rem;line-height:1.55}
.feedback .earned{display:block;color:#6542a8;font-size:.8rem}
.demo{margin:10px auto 0;padding:10px;background:#eef6ff;border-radius:16px}
.demo .board{width:135px}.demo .board-img{height:114px}
.demo p{margin:6px 0;font-size:.92rem;min-height:1.4em}
.demo .actions{margin-top:7px}.demo .button{min-height:44px}
.demo .button:disabled{opacity:.48}
.feedback-actions{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin:11px 0 2px}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.metric{background:#eef5ff;padding:10px 3px;border-radius:13px;text-align:center;font-size:.8rem}
.metric b{display:block;font-size:clamp(1rem,4.2vw,1.55rem)}
.stars{font-size:2.3rem;color:#835100;letter-spacing:.08em;text-shadow:0 2px #ffcf68}
.result .cast .mascot{height:clamp(70px,15vw,104px);width:clamp(67px,15vw,96px)}
.medals{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:9px;margin:12px 0}
.medal{border-radius:14px;background:#fff0c4;padding:10px 4px;text-align:center}
.medal.locked{background:#edf0f4;color:#536078}.medal.locked i{filter:grayscale(1);opacity:.66}
.medal i{display:block;font-style:normal;font-size:1.8rem}.medal strong{font-size:.82rem}
.medal small{display:block;font-size:.72rem;margin-top:4px}
.medal.just i{animation:float 1s ease 3;text-shadow:0 0 14px #ffbc20}
.method-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;text-align:center;margin-top:9px}
.notice{margin:9px auto 0;max-width:850px;background:#fff4ce;color:#674b13;border-radius:12px;padding:8px 11px;font-size:.8rem;text-align:center}
details{margin:12px auto 0;max-width:710px;text-align:left}
summary{cursor:pointer;padding:8px}
.hidden{display:none!important}
.particles{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.spark{position:absolute;left:var(--x);top:var(--y);color:var(--color);font-size:var(--size);animation:burst .9s ease-out both}
@keyframes burst{0%{transform:translate(0,0) scale(.35);opacity:0}18%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
@media(max-width:600px){
 .topbar{padding-top:9px;padding-bottom:9px}.brand{letter-spacing:0}.brand i{width:25px;height:25px}
 .pill{min-height:44px;padding:7px 9px;font-size:.82rem}
 main{padding-bottom:20px}.home-hero{padding-top:24px}.menu{grid-template-columns:repeat(2,1fr);gap:10px}
 .card{min-height:63px}.quiz-body{grid-template-columns:1fr;gap:5px}
 .quiz .board{width:clamp(137px,45vw,173px)}.quiz .board-img{height:151px}.quiz .demo .board{width:125px}
 .prompt{margin:6px auto 9px}.operand{font-size:3.45rem}.board-label{margin-bottom:4px}
}
@media(max-height:540px) and (orientation:landscape){
 .topbar{padding-top:5px;padding-bottom:5px}.hud{margin-bottom:5px}.progress{margin-bottom:5px}
 .quiz-body{grid-template-columns:1fr 1.1fr}.quiz .board{width:155px}.operand{font-size:3.15rem}
 .choice{min-height:45px}.home-hero{padding-top:6px}.cast .mascot{max-height:95px}.card{min-height:48px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition:none!important}}
</style>
</head>

const upper = digit => Math.floor(digit / 5);

    method = 'direct';
    steps = [[...direct, 0, movement(sign,n)]];
    explanation = movement(sign,n) + ' ぶんの たまを そのまま うごかせるよ。';
  } else if (inRange(tens + sign, 1) && canMove(digit, friend)) {
    method = 'friend';
    const unitStep = [...friend, 0, 'おともだちの ' + movement(-sign,complement)];
    steps = aroundTen(unitStep);
    explanation = n + 'の おともだちは ' + complement + '。' + (sign > 0
      ? complement + 'を ひいて、あとで 10を たすよ。'
      : 'さきに 10を ひいて、' + complement + 'を たすよ。');
  } else if (n < 5 && canMove(digit, exchange(sign,n))) {
    method = 'pair';
    steps = [exchange(sign,n)];
    explanation = n + 'の おあいてさんは ' + (5 - n) + '。五(ご)だま と 一(いち)だま ' + (5 - n) +
      'こを いっしょに ' + (sign > 0 ? 'おろすよ。' : 'あげるよ。');
  } else if (n >= 6 && inRange(tens + sign,1) && canMove(digit, exchange(-sign,complement))) {
    method = 'change';
    steps = aroundTen(exchange(-sign,complement));
    explanation = n + 'の おともだち ' + complement + 'を そのまま ' +
      (sign > 0 ? 'ひけないよ。五(ご)だまと一(いち)だまを あげて、10は あと！' :
        'たせないよ。10が さき！ それから 五(ご)だまと一(いち)だまを おろすよ。');
  } else {
    return null;
  }
  let value = start;
  const states = [{value:start, label:'はじめの そろばん'}];
  for (const [five, ones, ten, label] of steps) {
    value += 5 * five + ones + 10 * ten;
    states.push({value,label});
  }
  return {id:start + ':' + delta,start,delta,answer,method,steps,states,explanation};
}

const BANK = [];
const EXCLUDED_PROBLEMS = [];
for (let start = 1; start <= 19; start++) {
  for (let delta = -9; delta <= 9; delta++) {
    if (!delta || !inRange(start + delta,19)) continue;
    const question = buildQuestion(start,delta);
    if (question) BANK.push(question);
    else EXCLUDED_PROBLEMS.push({start,delta});
  }
}
const QUESTION_BY_ID = new Map(BANK.map(q => [q.id,q]));
const BONUS = {2:20,3:30,5:50,10:100,20:200};
const speedPoints = seconds => Math.max(0, 20 - Math.floor(seconds * 2));
const accuracy = (right, total) => total ? Math.round(100 * right / total) : 0;

function makeDeck(config) {
  if (config.mode === 'review') return config.ids.map(id => QUESTION_BY_ID.get(id)).filter(Boolean);
  const methods = config.mode === 'focus'
    ? (config.method === 'mix' ? METHOD_KEYS : [config.method])
    : LEVELS[config.level - 1].methods;
  const groups = methods.map(method => {
    const pool = BANK.filter(q => q.method === method);
    for (let index = pool.length - 1; index > 0; index--) {
      const other = Math.floor(Math.random() * (index + 1));
      [pool[index],pool[other]] = [pool[other],pool[index]];
    }
    return pool;
  });
  const order = LEVELS[config.level - 1].order || groups.map((_,index) => index);
  const first = Math.floor(Math.random() * order.length);
  return Array.from({length:config.length}, (_,index) => groups[order[(first + index) % order.length]].shift());
}

const BEAD_ASSETS = JSON.parse(document.getElementById('bead-assets').textContent);
const CHARACTERS = JSON.parse(document.getElementById('character-assets').textContent);
function board(value, accessibleLabel = 'いまの そろばん') {
  if (BEAD_ASSETS[value]) {
    return '<img class="board board-img" src="' + BEAD_ASSETS[value] + '" alt="' + accessibleLabel + '">';
  }
  const bead = (x,y,on,kind) => {
    const tone = on ? '#ed9638' : '#c8d2e4';
    return '<g data-bead="' + kind + '" data-on="' + Number(on) + '">' +
      '<path d="M' + x + ' ' + (y-11) + 'l23 9v4l-23 9-23-9v-4z" fill="' + tone +
      '" stroke="' + (on ? '#a95b18' : '#687d9f') + '" stroke-width="1.5"/>' +
      '<path d="M' + (x-16) + ' ' + (y-1) + 'l16-6 16 6" fill="none" stroke="#fff" stroke-opacity=".65" stroke-width="1.6"/></g>';
  };
  const rods = [Math.floor(value / 10),value % 10].map((digit,index) => {
    const x = 53 + index * 72;
    const count = lower(digit);
    let shapes = bead(x,upper(digit) ? 46 : 25,Boolean(upper(digit)),'five');
    for (let i = 0; i < 4; i++) shapes += bead(x,78 + 22 * i + (i < count ? 0 : 22),i < count,'one');
    return '<g data-rod="' + index + '"><path d="M' + x + ' 12v167" stroke="#8395aa" stroke-width="3"/>' + shapes + '</g>';
  }).join('');
  return '<svg class="board" viewBox="0 0 178 204" role="img" aria-label="' + accessibleLabel +
    '" xmlns="http://www.w3.org/2000/svg"><rect x="4" y="3" width="170" height="184" rx="14" fill="#355274"/>' +
    '<rect x="13" y="11" width="152" height="168" rx="7" fill="#fff8e9"/>' + rods +
    '<rect x="9" y="57" width="160" height="10" rx="2" fill="#355274"/>' +
    '<circle cx="125" cy="62" r="2.4" fill="#fff7c4"/>' +
    '<g fill="#52658a" text-anchor="middle" font-size="10" font-weight="700"><text x="53" y="201">じゅう</text>' +
    '<text x="125" y="201">いち</text></g></svg>';
}

</script>
<script>
'use strict';

const $ = id => document.getElementById(id);
const app = $('app');
const STORAGE_KEY = 'toyo-soroban-adventure-v1';
const today = () => {
  const d = new Date();
  return [d.getFullYear(), d.getMonth()+1, d.getDate()].map(v => String(v).padStart(2,'0')).join('-');
};
const freshRecord = () => ({
  total:0, correct:0, plays:0, best:0, streak:0, unlocked:1, sound:false,
  days:{}, methods:Object.fromEntries(METHOD_KEYS.map(k => [k,{total:0,correct:0}])),
  mistakes:{}, medals:[], bestByMode:{}, levelStars:{}, perfect:0
});
let record = freshRecord();
function storageWarning() { $('storage-note').classList.remove('hidden'); }
try {
  const saved = localStorage.getItem(STORAGE_KEY);
  if (saved) record = {...record,...JSON.parse(saved)};
} catch { storageWarning(); }
function save() {
  try { localStorage.setItem(STORAGE_KEY,JSON.stringify(record)); }
  catch { storageWarning(); }
}

const MEDALS = [
  ['first','🚩','はじめてのぼうけん','さいごまで 1かい あそぶ',r => r.plays >= 1],
  ['ten','🎯','10もんせいかい','あわせて 10もん せいかい',r => r.correct >= 10],
  ['streak','🔥','5れんぞくせいかい','5もん つづけて せいかい',r => r.streak >= 5],
  ['perfect','👑','はじめてのまんてん','10もん ぜんぶ せいかい',r => r.perfect >= 1],
  ['friend','🌈','おともだちマスター','おともだちで 20もん せいかい',r => r.methods.friend.correct >= 20],
  ['pair','💎','おあいてさんマスター','おあいてさんで 20もん せいかい',r => r.methods.pair.correct >= 20],
  ['change','✨','へんしんマスター','へんしんで 20もん せいかい',r => r.methods.change.correct >= 20],
  ['three','🌱','3にちれんしゅう','3にち れんしゅうする',r => Object.keys(r.days).length >= 3],
  ['seven','🌷','7にちれんしゅう','7にち れんしゅうする',r => Object.keys(r.days).length >= 7],
  ['hundred','🏆','100もんせいかい','あわせて 100もん せいかい',r => r.correct >= 100]
];
function award() {
  const added = MEDALS.filter(([id,,,,earned]) => !record.medals.includes(id) && earned(record)).map(([id]) => id);
  record.medals.push(...added);
  return added;
}
let run = null;
let recentMedals = [];
let audio = null;
const mascot = role => '<img class="mascot" src="' + CHARACTERS[role] + '" alt="" draggable="false">';
const cast = () => '<div class="cast" aria-hidden="true">' + mascot('cheer') + mascot('guide') + mascot('reward') + '</div>';
const button = (label,action,classes='button') =>
  '<button type="button" class="' + classes + '" data-action="' + action + '">' + label + '</button>';
const metric = (label,value) => '<div class="metric">' + label + '<b>' + value + '</b></div>';
const clock = seconds => {
  const full = Math.floor(seconds);
  return Math.floor(full / 60) + ':' + String(full % 60).padStart(2,'0');
};
function updateSound() {
  $('sound').textContent = 'おと ' + (record.sound ? 'ON' : 'OFF');
  $('sound').setAttribute('aria-pressed',record.sound);
}
function chime(kind) {
  if (!record.sound) return;
  try {
    const Engine = window.AudioContext || window.webkitAudioContext;
    if (!Engine) return;
    audio ||= new Engine();
    if (audio.state !== 'running') audio.resume().catch(() => {});
    const notes = kind === 'win' ? [523,659,784,1047] : [659,880];
    const now = audio.currentTime;
    notes.forEach((frequency,index) => {
      const start = now + index*.10;
      const oscillator = audio.createOscillator();
      const envelope = audio.createGain();
      oscillator.type = 'sine';
      oscillator.frequency.value = frequency;
      envelope.gain.setValueAtTime(.001,start);
      envelope.gain.exponentialRampToValueAtTime(.12,start+.018);
      envelope.gain.exponentialRampToValueAtTime(.001,start+.18);
      oscillator.connect(envelope).connect(audio.destination);
      oscillator.start(start);
      oscillator.stop(start+.2);
    });
  } catch { /* The visual feedback remains available. */ }
}
function celebration(count) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const holder = $('particles');
  const fragment = document.createDocumentFragment();
  const shades = ['#f2a526','#e25f9b','#463ddb','#158d68','#1b9fe4'];
  for (let i = 0; i < count; i++) {
    const spark = document.createElement('i');
    const angle = Math.random() * Math.PI * 2;
    const radius = 60 + Math.random() * Math.min(300,innerWidth*.47);
    spark.className = 'spark';
    spark.textContent = i % 3 ? '✦' : '▪';
    spark.style.cssText = '--x:50%;--y:44%;--size:' + (12+i%14) + 'px;--color:' + shades[i%5] +
      ';--dx:' + (Math.cos(angle)*radius) + 'px;--dy:' + (Math.sin(angle)*radius) + 'px;--r:' + (i*23) + 'deg';
    fragment.append(spark);
    setTimeout(() => spark.remove(),1100);
  }
  holder.append(fragment);
}
function screen(html,level=0) {
  $('particles').replaceChildren();
  app.innerHTML = html;
  document.body.dataset.level = level;
  $('home').classList.toggle('hidden',level === 0 && Boolean(app.querySelector('.home-hero')));
  window.scrollTo(0,0);
}
function section(title,content,level=0,classes='') {
  screen('<section class="panel ' + classes + '"><h2 tabindex="-1">' + title + '</h2>' + content + '</section>',level);
  app.querySelector('h2').focus({preventScroll:true});
}
function home() {
  run = null;
  const items = [
    ['🐾','れんしゅうする','setup:study','t1'], ['🏁','10もんチャレンジ','setup:challenge','t2'],
    ['⚡','スピードゲーム','setup:speed','t3'], ['🎯','にがてれんしゅう','setup:focus','t4'],
    ['🏅','メダルコレクション','medals','t5'], ['📖','きろくをみる','records','']
  ];
  screen('<section class="home-hero"><h1 class="title">そろばんのおやくそく<br><strong>大冒険！</strong></h1>' +
    '<p class="subtitle">おともだち・おあいてさん・へんしんを マスターしよう！</p>' + cast() +
    '</section><nav class="menu" aria-label="あそぶメニュー">' +
    items.map(([icon,label,action,tone]) => button('<span class="icon" aria-hidden="true">' + icon + '</span>' + label,
      action,'card ' + tone)).join('') + '</nav>' +
    '<details><summary>あそびかた</summary><div class="guide">' + mascot('guide') +
    '<p>そろばんの たまを みてね。つぎに たす・ひくときの おやくそくを 4つから えらぼう！</p></div></details>');
}
function setup(mode) {
  if (mode === 'focus') {
    const options = [...METHOD_KEYS.filter(k => k !== 'direct'),'mix'];
    section(MODES.focus,'<div class="guide">' + mascot('guide') + '<p>れんしゅうしたい おやくそくを えらんでね。</p></div>' +
      '<div class="levels">' + options.map(key => button(METHODS[key] || 'ぜんぶ ミックス','focus:' + key,
        'card stage ' + (COLORS[key] || 't3'))).join('') + '</div>');
    return;
  }
  section(MODES[mode],'<div class="guide">' + mascot('guide') + '<p>レベルを えらぼう。10もん なら 8もん せいかいで、つぎの レベルが ひらくよ！</p></div>' +
    '<div class="levels">' + LEVELS.map((level,index) => {
      const n = index + 1;
      const locked = n > record.unlocked;
      const stars = record.levelStars[n] || 0;
      return '<button class="card stage t' + n + '" type="button" data-action="level:' + mode + ':' + n + '"' +
        (locked ? ' disabled' : '') + '><span aria-hidden="true">' + (locked ? '🔒' : '📍') +
        '</span><span><strong>レベル ' + n + '　' + level.name + '</strong><br>' + level.lesson +
        (stars ? '　' + '★'.repeat(stars) : '') + '</span></button>';
    }).join('') + '</div>');
}
function speedSetup(level) {
  section('なんもん あそぶ？','<p class="lead center">はやく せいかいすると ボーナス！ 20もん なら 16もん せいかいで クリア！</p><div class="actions">' +
    button('10もん','speed:' + level + ':10','button primary') + button('20もん','speed:' + level + ':20') +
    '</div>',level);
}
function start(config) {
  const questions = makeDeck(config);
  if (!questions.length) return;
  run = {config, questions, index:0, score:0, right:0, streak:0, bestStreak:0, missed:[],
    begin:performance.now(), answered:false, gained:[]};

}
const current = () => run.questions[run.index];
function hud() {
  const level = ['review','focus'].includes(run.config.mode) ? '—' : run.config.level;
  return '<div class="hud"><div>レベル<b>' + level + '</b></div><div>もんだい<b>' + (run.index+1) +
    ' / ' + run.questions.length + '</b></div><div>とくてん<b>' + run.score + '</b></div><div>れんぞく<b>' +
    run.streak + '</b></div></div>';
}
function question() {
  const q = current();
  run.answered = false;
  run.questionAt = performance.now();
  screen('<section class="game"><div id="hud">' + hud() + '</div><div class="progress" aria-hidden="true"><i style="width:' +
    (100*run.index/run.questions.length) + '%"></i></div><section class="panel quiz"><div class="quiz-body"><div>' +
    '<p class="board-label">いまの そろばん</p>' + board(q.start) + '</div><div><div class="operand">' + symbol(q.delta) +
    '</div><h2 class="prompt" id="prompt" tabindex="-1">どのおやくそくを つかう？</h2><div class="choices" aria-labelledby="prompt">' +
    METHOD_KEYS.map(key => '<button type="button" class="choice ' + COLORS[key] + '" data-action="answer:' + key +
      '" aria-pressed="false"><span aria-hidden="true">' + MARKS[key] + '</span> ' + METHODS[key] + '</button>').join('') +
    '</div></div></div><div id="feedback-area"></div></section></section>',run.config.level);
  $('prompt').focus({preventScroll:true});
}
function logAnswer(q,right) {
  const date = today();
  record.total++;
  record.days[date] = (record.days[date] || 0) + 1;
  const method = record.methods[q.method];
  method.total++;
  if (right) {
    record.correct++;
    method.correct++;
    if (run.config.mode === 'review' && record.mistakes[q.id]) record.mistakes[q.id].pending = false;
  } else {
    const mistake = record.mistakes[q.id] || {count:0};
    record.mistakes[q.id] = {count:mistake.count+1,pending:true};
  }
  record.streak = Math.max(record.streak,run.bestStreak);
  run.gained.push(...award());
  if (run.gained.length) recentMedals = [...run.gained];
  save();
}
function answer(key) {
  if (!run || run.answered) return;
  run.answered = true;
  const q = current();
  const right = key === q.method;
  const seconds = (performance.now()-run.questionAt)/1000;
  let bonus = 0;
  let speed = 0;
  if (right) {
    run.right++;
    run.streak++;
    run.bestStreak = Math.max(run.bestStreak,run.streak);
    bonus = BONUS[run.streak] || 0;
    speed = run.config.mode === 'speed' ? speedPoints(seconds) : 0;
    run.score += 100 + bonus + speed;
    chime('right');
    celebration(bonus ? 24 : 10);
  } else {
    run.streak = 0;
    run.missed.push(q.id);
  }
  if (run.index === run.questions.length-1) run.elapsed = (performance.now()-run.begin)/1000;
  logAnswer(q,right);
  $('hud').innerHTML = hud();
  const bar = app.querySelector('.progress i');
  bar.style.width = 100*(run.index+1)/run.questions.length + '%';
  for (const choice of app.querySelectorAll('.choice')) {
    choice.disabled = true;
    choice.setAttribute('aria-pressed',String(choice.dataset.action === 'answer:' + key));
    choice.classList.toggle('correct',choice.dataset.action === 'answer:' + q.method);
  }
  $('feedback-area').innerHTML = '<div class="feedback' + (right ? ' bounce' : '') + '" role="status">' + mascot('cheer') +
    '<h3 id="feedback-title" tabindex="-1"' + (right ? '' : ' class="miss"') + '>' +
    (right ? 'せいかい！' + (bonus ? '　' + run.streak + 'れんぞく！' : '') : 'おしい！ たまの うごきを みよう！') +
    '</h3><p><strong>' + METHODS[q.method] + '</strong>　' + q.explanation +
    (right ? '<span class="earned">＋100てん' + (bonus ? '　コンボ ＋'+bonus : '') +
      (speed ? '　スピード ＋'+speed : '') + '</span>' : '') + '</p></div>' +
    '<div id="demo" class="demo hidden"></div><div class="feedback-actions">' +
    button('たまの うごき','demo') + (right ? '' : button('もういちど みる','recheck')) +
    button(run.index+1 < run.questions.length ? 'つぎの もんだい →' : 'けっかを みる →',
      'next','button primary') + '</div>';
  if (run.config.mode === 'study' || run.config.mode === 'review' || !right) showDemo(0);
  $('feedback-title').focus({preventScroll:false});
}
function showDemo(index,focusAction) {
  const q = current();
  const step = q.states[index];

  if (!step || !demo) return;
  demo.classList.remove('hidden');
  demo.innerHTML = board(step.value,'そろばんの たまは ' + step.value) + '<p aria-live="polite">' +
    index + ' / ' + (q.states.length-1) + '　' + step.label +

    '<button class="button" type="button" data-action="step:' + (index-1) + '"' + (index ? '' : ' disabled') + '>← もどる</button>' +
    '<button class="button" type="button" data-action="step:' + (index+1) + '"' +
    (index < q.states.length-1 ? '' : ' disabled') + '>たまを うごかす →</button></div>';
  if (focusAction !== undefined) {
    const buttons = Array.from(demo.querySelectorAll('button'));
    const target = focusAction === 'first' ? buttons[1] : (buttons[focusAction] || buttons[0]);
    (target.disabled ? buttons.find(b => !b.disabled) : target)?.focus();
  }
}
function next() {
  if (!run?.answered) return;
  if (run.index+1 === run.questions.length) finish();
  else {
    run.index++;
    question();
  }
}
function finish() {
  const n = run.questions.length;
  const percent = accuracy(run.right,n);
  const perfect = run.right === n;
  const qualifies = ['study','challenge','speed'].includes(run.config.mode);
  const medalRound = qualifies || run.config.mode === 'focus';
  const stars = perfect ? 3 : percent >= 80 ? 2 : percent >= 50 ? 1 : 0;
  if (perfect && n >= 10) {
    run.score += n === 20 ? 300 : 150;
    if (medalRound) record.perfect++;
  }
  record.plays++;
  const bestKey = [run.config.mode,run.config.level,n,run.config.method || ''].join(':');
  const best = record.bestByMode[bestKey] || 0;
  const newBest = run.score > best && run.score > 0 && run.config.mode !== 'review';
  if (run.config.mode !== 'review') {
    record.bestByMode[bestKey] = Math.max(run.score,best);
    record.best = Math.max(run.score,record.best);
  }
  const level = run.config.level;
  let unlocked = false;
  if (qualifies) {
    record.levelStars[level] = Math.max(record.levelStars[level] || 0,stars);
    if (percent >= 80 && level === record.unlocked && level < LEVELS.length) {
      record.unlocked++;
      unlocked = true;
    }
  }
  run.gained.push(...award());
  recentMedals = [...run.gained];
  save();
  const title = perfect ? 'ぜんもん せいかい！' : unlocked ? 'ステージ クリア！' : 'ぼうけん おつかれさま！';
  const rewards = (newBest ? '<p class="center">🎉 じこベスト こうしん！</p>' : '') +
    (unlocked ? '<p class="center">🗺️ レベル ' + record.unlocked + ' が ひらいたよ！</p>' : '') +
    (run.gained.length ? '<div class="guide">' + mascot('reward') + '<p>メダルゲット！<br>' +
      MEDALS.filter(([id]) => run.gained.includes(id)).map(m => m[2]).join('・') + '</p></div>' : '');
  section(title,cast() + '<p class="stars center" aria-label="ほし ' + stars + 'こ">' +
    '★'.repeat(stars) + '☆'.repeat(3-stars) + '</p><div class="summary">' +
    metric('とくてん',run.score+'てん') + metric('せいかい',run.right+' / '+n) + metric('せいかいりつ',percent+'%') +
    metric('かかった じかん',clock(run.elapsed)) + metric('さいこう れんぞく',run.bestStreak+'もん') +
    metric('じこベスト',run.config.mode === 'review' ? '—' : record.bestByMode[bestKey]+'てん') + '</div>' + rewards +
    '<div class="actions">' + button('もういちど あそぶ','again','button primary') +
    (run.missed.length ? button('まちがえた もんだい','review:round') : '') +
    (unlocked ? button('つぎの レベル →','level:' + run.config.mode + ':' + record.unlocked) : '') +
    button('ホームにもどる','home') + '</div>',level,'result');
  if (perfect || unlocked || newBest || run.gained.length) chime('win');

}
function medals() {
  section('メダルコレクション','<div class="guide">' + mascot('reward') +
    '<p>' + record.medals.length + ' / ' + MEDALS.length + ' こ あつめたよ！</p></div><div class="medals">' +
    MEDALS.map(([id,icon,name,hint]) => {
      const earned = record.medals.includes(id);
      return '<div class="medal' + (earned ? '' : ' locked') + (recentMedals.includes(id) ? ' just' : '') +
        '"><i aria-hidden="true">' + icon + '</i><strong>' + name + '</strong><small>' +
        (earned ? 'ゲット！' : hint) + '</small></div>';
    }).join('') + '</div>');
}
function records() {
  const pending = Object.values(record.mistakes).filter(q => q.pending).length;
  section('きろくをみる','<div class="summary">' +
    metric('いままでの もんだい',record.total+'もん') + metric('いままでの せいかい',record.correct+'もん') +
    metric('さいごまで あそんだ かいすう',record.plays+'かい') + metric('さいこう とくてん',record.best+'てん') +
    metric('さいこう れんぞく',record.streak+'もん') + metric('れんしゅうした ひ',Object.keys(record.days).length+'にち') +
    metric('きょうの もんだい',(record.days[today()] || 0)+'もん') +
    metric('ふくしゅう できる もんだい',pending+'もん') +
    metric('あつめた メダル',record.medals.length+'こ') + '</div><h3 class="center">おやくそくごとの せいかいりつ</h3>' +
    '<div class="method-stats">' + METHOD_KEYS.map(key => {
      const info = record.methods[key];
      return metric(METHODS[key],info.total ? accuracy(info.correct,info.total)+'%（'+info.correct+'/'+info.total+'）' : '—');
    }).join('') + '</div><div class="actions">' + (pending ? button('まちがえた もんだい','review:saved','button primary') : '') +
    button('ホームにもどる','home') + '</div>');
}

$('sound').addEventListener('click',() => {
  record.sound = !record.sound;
  updateSound();
  save();
  if (record.sound) chime('right');
});
$('home').addEventListener('click',home);
app.addEventListener('click',event => {
  const trigger = event.target.closest('button[data-action]');
  if (!trigger || trigger.disabled) return;
  const [action,value,extra] = trigger.dataset.action.split(':');
  switch (action) {
    case 'home': home(); break;
    case 'setup': setup(value); break;
    case 'level':
      if (Number(extra) > record.unlocked) return;
      if (value === 'speed' || Number(extra) === 5) speedSetup(Number(extra));
      else start({mode:value,level:Number(extra),length:10});
      break;
    case 'speed': start({mode:'speed',level:Number(value),length:Number(extra)}); break;
    case 'focus': start({mode:'focus',method:value,level:4,length:10}); break;
    case 'review': {
      const ids = value === 'round' ? [...new Set(run.missed)] : Object.keys(record.mistakes).filter(id => record.mistakes[id].pending).slice(0,10);
      start({mode:'review',level:4,ids});
      break;
    }
    case 'answer': answer(value); break;
    case 'next': next(); break;
    case 'demo':
    case 'recheck': showDemo(0,'first'); break;
    case 'step': showDemo(Number(value),trigger.textContent.startsWith('←') ? 0 : 1); break;
    case 'again': start(run.config); break;
    case 'medals': medals(); break;
    case 'records': records(); break;
  }
});
updateSound();
home();

</script>
</body>
</html>
